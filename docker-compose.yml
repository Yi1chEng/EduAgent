services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eduagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eduagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduagent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/eduagent
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

      - ./mcp_servers.json:/mcp_servers.json:ro
      - upload_data:/app/uploads

volumes:
  pgdata:
  upload_data:
